name: ssh-test

# Isolated test of the online-SSH step used by the compile workflows (~3 minutes instead of
# waiting for a full firmware build).

on:
  workflow_dispatch:
    inputs:
      timeout_min:
        description: 'how long the sshx session stays open (minutes)'
        required: false
        default: '2'

jobs:
  ssh-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: 开始
        run: |
          echo "runner=$(uname -a)"
          echo "start=$(date -u +%H:%M:%S)"

      - name: 在线 SSH（新实现，走 Mine-debugger-action）
        uses: authon/Mine-debugger-action@main
        env:
          TIMEOUT_MIN: ${{ inputs.timeout_min }}
          SSHX_NAME: openwrt-ssh-test

      - name: 结束
        run: echo "done=$(date -u +%H:%M:%S)"
