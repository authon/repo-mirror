name: sshx-shell-test

# Verifies the Ctrl+D behaviour of the online-SSH script in authon/Mine-debugger-action.
#
# Fact learned the hard way: sshx does NOT spawn the shell at startup. It creates the shell
# lazily when a client connects, so with nobody connected there is no interactive shell at
# all (and therefore no risk of the wrapper ending the session early).
#
# So this test drives the wrapper by hand on a real PTY and gives it EOF, which is exactly
# what Ctrl+D does to an interactive shell:
#   1. the link is printed and /tmp/sshx-shell.sh is generated correctly
#   2. with nobody connected, sshx stays alive (the session is not ended early)
#   3. EOF on the shell -> sshx dies -> the script continues within seconds

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 取到被测脚本
        uses: actions/checkout@v4
        with:
          repository: authon/Mine-debugger-action
          ref: main
          path: dbg

      - name: 后台启动脚本（TIMEOUT_MIN=4）
        run: |
          cd dbg
          export HOME_PATH="$PWD"
          export TIMEOUT_MIN=4
          export SSHX_NAME=shell-exit-test
          setsid bash ./script.sh > /tmp/run.log 2>&1 &
          echo $! > /tmp/run.pid
          sleep 2
          echo "script pid = $(cat /tmp/run.pid)"

      - name: 检查①链接出现 ②wrapper 生成正确 ③无人连接时 sshx 不提前退出
        run: |
          for i in $(seq 1 60); do
            grep -qE 'https://sshx\.io/s/' /tmp/run.log && break
            sleep 2
          done
          URL="$(grep -oE 'https://sshx\.io/s/[A-Za-z0-9]+#[A-Za-z0-9_-]+' /tmp/run.log | head -1)"
          echo "URL = ${URL}"
          [ -n "$URL" ] || { echo "FAIL: 没拿到链接"; cat /tmp/run.log; exit 1; }

          echo "--- 脚本生成的 /tmp/sshx-shell.sh ---"
          cat /tmp/sshx-shell.sh
          grep -q 'bash -i'              /tmp/sshx-shell.sh || { echo "FAIL: wrapper 没有跑交互 shell"; exit 1; }
          grep -q 'trap stop_sshx EXIT'  /tmp/sshx-shell.sh || { echo "FAIL: wrapper 没有装 EXIT trap"; exit 1; }
          grep -q 'pkill -x sshx'        /tmp/sshx-shell.sh || { echo "FAIL: wrapper 不会结束 sshx"; exit 1; }
          [ -s /tmp/sshx.pid ] || { echo "FAIL: 没有写 /tmp/sshx.pid"; exit 1; }

          echo "--- 等 20 秒，确认没人连接时会话不会提前结束 ---"
          sleep 20
          kill -0 "$(cat /tmp/run.pid)" 2>/dev/null || { echo "FAIL: 脚本提前退出"; cat /tmp/run.log; exit 1; }
          pgrep -x sshx > /dev/null       || { echo "FAIL: sshx 提前退出"; cat /tmp/run.log; exit 1; }
          echo "OK: 无人连接时脚本和 sshx 都还活着"

          echo "--- 进程树（应能看到 sshx 没有子 shell）---"
          ps -eo pid,ppid,pgid,comm,args | grep -E '[s]shx|[s]cript\.sh' || true

      - name: 模拟 Ctrl+D（真 PTY 上给交互 shell 发 EOF），检查是否立刻继续编译
        run: |
          T0=$(date +%s)
          set +e
          timeout 30 script -q -e -c "/tmp/sshx-shell.sh" /dev/null < /dev/null
          echo "wrapper 退出码 = $?"
          set -e

          for i in $(seq 1 30); do
            kill -0 "$(cat /tmp/run.pid)" 2>/dev/null || break
            sleep 1
          done
          T1=$(date +%s)
          echo "从结束 shell 到脚本退出用了 $((T1-T0)) 秒"

          echo "--- 脚本日志 ---"
          cat /tmp/run.log

          pgrep -x sshx > /dev/null && { echo "FAIL: sshx 还活着"; exit 1; } || echo "OK: sshx 已经被结束"
          grep -q '在线 SSH 会话已结束，继续编译' /tmp/run.log \
            || { echo "FAIL: 没有走正常结束分支"; exit 1; }
          [ $((T1-T0)) -le 20 ] \
            || { echo "FAIL: 用了 $((T1-T0)) 秒，Ctrl+D 没有立刻生效"; exit 1; }
          echo "PASS: Ctrl+D 立刻继续编译"
