name: copy-repo

# Server-side repository copier.
# Uploading git packs from this machine keeps getting reset, so the copy runs on a
# GitHub runner instead: it mirror-clones the source and pushes into the destination
# repo owned by the SYNC_TOKEN account. The result has no fork relationship.

on:
  workflow_dispatch:
    inputs:
      src:
        description: 'source repo, owner/name'
        required: true
      dst:
        description: 'destination repo name (created if missing)'
        required: true
      default_branch:
        description: 'branch to set as default afterwards (optional)'
        required: false
        default: ''
      force:
        description: 'force update existing refs (true/false)'
        required: false
        default: 'false'

jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - name: show request
        run: |
          echo "src=${{ inputs.src }}"
          echo "dst=${{ inputs.dst }}"
          echo "default_branch=${{ inputs.default_branch }}"
          echo "force=${{ inputs.force }}"
          echo "owner=${{ github.repository_owner }}"

      - name: create destination repo if missing
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          body=$(printf '{"name":"%s","private":false,"has_issues":false,"has_wiki":false,"has_projects":false,"has_discussions":false,"description":"Copy of %s"}' \
            "${{ inputs.dst }}" "${{ inputs.src }}")
          code=$(curl -sS -o /tmp/create.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${SYNC_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "User-Agent: repo-mirror" \
            https://api.github.com/user/repos -d "${body}")
          echo "create-repo http ${code}"
          head -c 400 /tmp/create.json; echo

      - name: mirror clone source
        run: |
          git clone --mirror "https://github.com/${{ inputs.src }}.git" src.git
          cd src.git
          echo "branches:"; git for-each-ref --format='  %(refname)' refs/heads | head -50
          echo "tags:";     git for-each-ref --format='  %(refname)' refs/tags  | head -50
          du -sh .

      - name: push branches and tags
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          cd src.git
          if [ "${{ inputs.force }}" = "true" ]; then FORCE=--force; else FORCE=; fi
          git push $FORCE \
            "https://x-access-token:${SYNC_TOKEN}@github.com/${{ github.repository_owner }}/${{ inputs.dst }}.git" \
            "refs/heads/*:refs/heads/*" "refs/tags/*:refs/tags/*"

      - name: set default branch
        if: inputs.default_branch != ''
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          curl -sS -X PATCH \
            -H "Authorization: Bearer ${SYNC_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "User-Agent: repo-mirror" \
            "https://api.github.com/repos/${{ github.repository_owner }}/${{ inputs.dst }}" \
            -d "{\"default_branch\":\"${{ inputs.default_branch }}\"}" | head -c 400; echo
